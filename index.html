<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tech HUB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">M</div>

            <div>
                <strong>My Tech</strong>
                <span>HUB</span>
            </div>
        </div>

        <nav class="navigation">

            <button class="nav-button active" data-page="home">
                <span>⌂</span>
                <b>Ana Sayfa</b>
            </button>

            <button class="nav-button" data-page="devices">
                <span>▣</span>
                <b>Cihazlar</b>
            </button>

            <button class="nav-button" data-page="modes">
                <span>◇</span>
                <b>Modlar</b>
            </button>

            <button class="nav-button" data-page="ai">
                <span>✦</span>
                <b>AI Asistan</b>
            </button>

        </nav>

        <div class="sidebar-bottom">

            <button class="nav-button" data-page="settings">
                <span>⚙</span>
                <b>Ayarlar</b>
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="search-box">

                <span>⌕</span>

                <input
                    id="search"
                    type="text"
                    placeholder="Cihaz, mod veya özellik ara..."
                >

            </div>

            <button class="top-button" id="notificationButton">
                ♢
            </button>

            <button class="profile-button" id="profileButton">

                <div class="avatar">
                    M
                </div>

                <div class="profile-text">
                    <strong>My Profile</strong>
                    <small>Yönetici</small>
                </div>

            </button>

        </header>


        <!-- ================= HOME ================= -->

        <section class="page active" id="home">

            <div class="hero">

                <div>

                    <span class="eyebrow">
                        MY TECH HUB
                    </span>
