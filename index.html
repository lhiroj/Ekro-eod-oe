<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tech HUB</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-icon">M</div>
      <div>
        <strong>My Tech</strong>
        <span>HUB</span>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" data-page="home">
        <span>⌂</span> Ana Sayfa
      </button>

      <button class="nav-btn" data-page="devices">
        <span>▣</span> Cihazlar
      </button>

      <button class="nav-btn" data-page="modes">
        <span>◈</span> Modlar
      </button>

      <button class="nav-btn" data-page="ai">
        <span>✦</span> AI Asistan
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-btn" data-page="settings">
        <span>⚙</span> Ayarlar
      </button>
    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="search">
        <span>⌕</span>
        <input id="searchInput" type="text" placeholder="Cihaz, mod veya özellik ara...">
      </div>

      <button class="icon-btn" id="notificationBtn">♢</button>

      <button class="profile" id="profileBtn">
        <div class="avatar">M</div>
        <div>
          <strong>My Profile</strong>
          <small>Yönetici</small>
        </div>
      </button>

    </header>


    <!-- ================= HOME ================= -->

    <section class="page active-page" id="page-home">

      <div class="hero">
        <div>
          <p class="eyebrow">MY TECH HUB</p>
          <h1>Her şey kontrolünde.</h1>
          <p class="hero-text">
            Cihazlarını, ışıklarını ve modlarını tek bir yerden yönet.
          </p>
        </div>

        <div class="hero-icon">✦</div>
      </div>


      <!-- MODES -->

      <div class="section-header">
        <div>
          <h2>Hızlı Modlar</h2>
          <p>Tek dokunuşla ortamını değiştir.</p>
        </div>

        <button class="text-btn" data-page="modes">
          Tümünü gör →
        </button>
      </div>

      <div class="mode-grid">

        <button class="mode-card gaming" data-mode="gaming">
          <div class="mode-icon">🎮</div>
          <div>
            <strong>Gaming</strong>
            <span>Oyun zamanı</span>
          </div>
        </button>

        <button class="mode-card movie" data-mode="movie">
          <div class="mode-icon">🎬</div>
          <div>
            <strong>Film</strong>
            <span>Sinema atmosferi</span>
          </div>
        </button>

        <button class="mode-card sleep" data-mode="sleep">
          <div class="mode-icon">🌙</div>
          <div>
            <strong>Uyku</strong>
            <span>Gece modu</span>
          </div>
        </button>

        <button class="mode-card new-mode" id="newModeBtn">
          <div class="mode-icon">＋</div>
          <div>
            <strong>Yeni Mod</strong>
            <span>Mod oluştur</span>
          </div>
        </button>

      </div>


      <!-- DEVICES -->

      <div class="section-header">
        <div>
          <h2>Cihazların</h2>
          <p>Ba
